<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FR.io - TC Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0f1d; font-family: 'Segoe UI', Arial, sans-serif; position: fixed; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }

        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 15, 29, 0.92); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 10; color: white;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel h1 { font-size: 32px; margin-bottom: 15px; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #161b2e; color: #fff; font-size: 16px; outline: none; -webkit-appearance: none;
        }
        .btn-play {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: white; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 5px;
        }

        #leaderboard {
            position: absolute; top: 12px; right: 12px; z-index: 5;
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px; border-radius: 10px; color: white; width: 150px;
            backdrop-filter: blur(4px); pointer-events: none;
        }
        #leaderboard h3 { font-size: 12px; letter-spacing: 1px; color: #00f2fe; margin-bottom: 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
        #leaderboard ol { list-style: none; padding: 0; margin: 0; }
        #leaderboard li { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 3px; color: #ddd; }
        #leaderboard li.me { color: #ffeb3b; }

        #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); touch-action: none; z-index: 5; }
        #joystick-knob { position: absolute; top: 32.5px; left: 32.5px; width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none; }
        #mobile-controls { position: absolute; bottom: 25px; right: 25px; display: flex; gap: 12px; z-index: 5; }
        .act-btn { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); color: white; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .act-btn:active { background: rgba(255,255,255,0.4); }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="lobby">
        <div class="panel">
            <h1>FR.io</h1>
            <div class="input-group">
                <label>玩家名稱</label>
                <input type="text" id="nickname" placeholder="請輸入暱稱..." maxlength="10" value="無名玩家">
            </div>
            <div class="input-group">
                <label>選擇伺服器</label>
                <select id="server-select">
                    <option value="frio_asia_server_1">第一伺服器 (Asia 1)</option>
                    <option value="frio_asia_server_2">第二伺服器 (Asia 2)</option>
                </select>
            </div>
            <button class="btn-play" onclick="startGame()">進入遊戲</button>
        </div>
    </div>

    <div id="leaderboard">
        <h3>排行榜</h3>
        <ol id="rank-list"></ol>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="mobile-controls">
        <div class="act-btn" id="btn-w">W</div>
        <div class="act-btn" id="btn-space">分</div>
    </div>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const GAME_SIG = "FR_IO_SECURE_AUTH_2026";
const WORLD_SIZE = 4000;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let gridPattern = null;

function initGridPattern() {
    const pCanvas = document.createElement('canvas');
    const gridSize = 60;
    pCanvas.width = gridSize; pCanvas.height = gridSize;
    const pCtx = pCanvas.getContext('2d');
    pCtx.fillStyle = '#0c0f1d'; pCtx.fillRect(0, 0, gridSize, gridSize);
    pCtx.strokeStyle = '#181d36'; pCtx.lineWidth = 2; pCtx.strokeRect(0, 0, gridSize, gridSize);
    gridPattern = ctx.createPattern(pCanvas, 'repeat');
}

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    initGridPattern();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let peer, conn, isHost = false;
let myName = "無名玩家";
let myId = 'peer_' + Math.random().toString(36).substring(2, 9);

let gameState = { players: {}, foods: [], viruses: [], ejected: [] };
let localInput = { angle: 0, speed: 0, split: false, eject: false };

function startGame() {
    myName = document.getElementById('nickname').value.trim() || "無名玩家";
    const serverId = document.getElementById('server-select').value;
    document.getElementById('lobby').style.display = 'none';

    peer = new Peer(myId);
    peer.on('open', () => {
        conn = peer.connect(serverId, { metadata: { signature: GAME_SIG }, reliable: false });
        conn.on('open', () => setupClientConn(conn));
        conn.on('error', () => becomeHost(serverId));

        setTimeout(() => {
            if (!conn || !conn.open) becomeHost(serverId);
        }, 1200);
    });
}

function becomeHost(roomId) {
    isHost = true;
    peer = new Peer(roomId);

    for (let i = 0; i < 350; i++) gameState.foods.push(createFood());
    for (let i = 0; i < 15; i++) gameState.viruses.push(createVirus());
    gameState.players[myId] = createPlayer(myId, myName);

    peer.on('connection', (c) => {
        if (!c.metadata || c.metadata.signature !== GAME_SIG) { c.close(); return; }

        c.on('data', (data) => {
            if (gameState.players[c.peer]) gameState.players[c.peer].lastSeen = Date.now();
            if (data.type === 'JOIN') gameState.players[c.peer] = createPlayer(c.peer, data.name);
            if (data.type === 'INPUT' && gameState.players[c.peer]) {
                gameState.players[c.peer].input = data.input;
            }
        });
        c.on('close', () => { delete gameState.players[c.peer]; });
    });

    setInterval(updateHostLogic, 1000 / 30);
}

function setupClientConn(c) {
    c.send({ type: 'JOIN', name: myName });
    c.on('data', (data) => {
        if (data.type === 'STATE') gameState = data.state;
    });
}

function createPlayer(id, name) {
    return {
        id, name,
        x: Math.random() * (WORLD_SIZE - 200) + 100,
        y: Math.random() * (WORLD_SIZE - 200) + 100,
        mass: 20, color: `hsl(${Math.random() * 360}, 80%, 55%)`,
        input: { angle: 0, speed: 0, split: false, eject: false },
        lastSeen: Date.now()
    };
}

function createFood() {
    return { x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, color: `hsl(${Math.random() * 360}, 85%, 60%)` };
}

function createVirus() {
    return { x: Math.random() * (WORLD_SIZE - 300) + 150, y: Math.random() * (WORLD_SIZE - 300) + 150, radius: 42, mass: 100 };
}

function updateHostLogic() {
    const now = Date.now();
    let playerList = Object.values(gameState.players);

    // 清除超過 3 秒離線的幽靈玩家
    Object.keys(gameState.players).forEach(pId => {
        if (pId !== myId && now - gameState.players[pId].lastSeen > 3000) {
            delete gameState.players[pId];
        }
    });

    playerList.forEach(p => {
        let input = (p.id === myId) ? localInput : p.input;

        // W 吐質機制
        if (input.eject && p.mass >= 35) {
            p.mass -= 13;
            let r = Math.sqrt(p.mass) * 8;
            gameState.ejected.push({
                x: p.x + Math.cos(input.angle) * (r + 15),
                y: p.y + Math.sin(input.angle) * (r + 15),
                angle: input.angle,
                speed: 12,
                mass: 10,
                color: p.color
            });
            input.eject = false;
        }

        let radius = Math.sqrt(p.mass) * 8;
        let speed = Math.max(1.8, 7.5 - (radius * 0.035)) * (input.speed || 0);

        p.x += Math.cos(input.angle) * speed;
        p.y += Math.sin(input.angle) * speed;

        p.x = Math.max(radius, Math.min(WORLD_SIZE - radius, p.x));
        p.y = Math.max(radius, Math.min(WORLD_SIZE - radius, p.y));

        // 吞噬食物與噴出質量塊
        for (let i = gameState.foods.length - 1; i >= 0; i--) {
            let f = gameState.foods[i];
            if (Math.hypot(p.x - f.x, p.y - f.y) < radius) {
                p.mass += 1;
                gameState.foods[i] = createFood();
            }
        }
        for (let i = gameState.ejected.length - 1; i >= 0; i--) {
            let e = gameState.ejected[i];
            if (Math.hypot(p.x - e.x, p.y - e.y) < radius) {
                p.mass += e.mass;
                gameState.ejected.splice(i, 1);
            }
        }
    });

    // 動態更新吐質小球飛行狀態
    gameState.ejected.forEach(e => {
        if (e.speed > 0) {
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
            e.speed *= 0.88;
        }
    });

    // 玩家互吃判定 (大於對方 20 點質量)
    for (let i = 0; i < playerList.length; i++) {
        for (let j = 0; j < playerList.length; j++) {
            if (i === j) continue;
            let p1 = playerList[i];
            let p2 = playerList[j];

            if (p1.mass >= p2.mass + 20) {
                let r1 = Math.sqrt(p1.mass) * 8;
                if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < r1 - 8) {
                    p1.mass += p2.mass;
                    p2.mass = 20;
                    p2.x = Math.random() * (WORLD_SIZE - 200) + 100;
                    p2.y = Math.random() * (WORLD_SIZE - 200) + 100;
                }
            }
        }
    }

    // 廣播最新世界狀態
    if (peer && peer.connections) {
        Object.keys(peer.connections).forEach(pId => {
            if (peer.connections[pId][0] && peer.connections[pId][0].open) {
                peer.connections[pId][0].send({ type: 'STATE', state: gameState });
            }
        });
    }
}

function updateLeaderboard() {
    const listEl = document.getElementById('rank-list');
    const sorted = Object.values(gameState.players).sort((a, b) => b.mass - a.mass).slice(0, 5);

    let html = '';
    sorted.forEach((p, i) => {
        html += `<li class="${p.id === myId ? 'me' : ''}"><span>${i + 1}. ${p.name}</span><span>${Math.floor(p.mass)}</span></li>`;
    });
    listEl.innerHTML = html;
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let me = gameState.players[myId];
    if (me) {
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.translate(window.innerWidth / 2 - me.x, window.innerHeight / 2 - me.y);

        ctx.fillStyle = gridPattern;
        ctx.fillRect(-WORLD_SIZE, -WORLD_SIZE, WORLD_SIZE * 3, WORLD_SIZE * 3);

        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 8;
        ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        // 食物與吐質小球 (底層)
        gameState.foods.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI * 2); ctx.fill();
        });
        gameState.ejected.forEach(e => {
            ctx.fillStyle = e.color;
            ctx.beginPath(); ctx.arc(e.x, e.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        });

        // 刺球 (中層)
        gameState.viruses.forEach(v => {
            ctx.fillStyle = '#33ff33';
            ctx.beginPath(); ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#22cc22'; ctx.lineWidth = 4; ctx.stroke();
        });

        // 玩家排序（質量小先畫，大球壓在上層）
        const sortedPlayers = Object.values(gameState.players).sort((a, b) => a.mass - b.mass);
        sortedPlayers.forEach(p => {
            let r = Math.sqrt(p.mass) * 8;

            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.max(12, r * 0.35)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(p.name, p.x, p.y + (r * 0.12));
        });

        ctx.restore();
        updateLeaderboard();
    }

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

// 輸入操控綁定
window.addEventListener('mousemove', (e) => {
    let centerX = window.innerWidth / 2;
    let centerY = window.innerHeight / 2;
    localInput.angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
    localInput.speed = 1;
    sendInput();
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyW') localInput.eject = true;
    if (e.code === 'Space') localInput.split = true;
    sendInput();
});

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');

joyZone.addEventListener('touchmove', (e) => {
    let rect = joyZone.getBoundingClientRect();
    let touch = e.touches[0];
    let dx = touch.clientX - (rect.left + rect.width / 2);
    let dy = touch.clientY - (rect.top + rect.height / 2);
    let dist = Math.hypot(dx, dy);
    let maxDist = rect.width / 2;
    let angle = Math.atan2(dy, dx);
    let limitDist = Math.min(dist, maxDist);

    joyKnob.style.transform = `translate(${Math.cos(angle)*limitDist}px, ${Math.sin(angle)*limitDist}px)`;
    localInput.angle = angle;
    localInput.speed = limitDist / maxDist;
    sendInput();
});

joyZone.addEventListener('touchend', () => {
    joyKnob.style.transform = `translate(0px, 0px)`;
    localInput.speed = 0;
    sendInput();
});

document.getElementById('btn-w').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.eject = true; sendInput(); });
document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.split = true; sendInput(); });

function sendInput() {
    if (!isHost && conn && conn.open) conn.send({ type: 'INPUT', input: localInput });
}
</script>
</body>
</html>

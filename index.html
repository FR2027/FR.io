<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FR.io - Ultima Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0c0f1d; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }

        /* 登入大廳 UI */
        #lobby {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 15, 29, 0.9); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 10; color: white;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px; border-radius: 16px; width: 340px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel h1 { font-size: 36px; margin-bottom: 20px; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #161b2e; color: #fff; font-size: 16px; outline: none;
        }
        .btn-play {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: white; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px;
        }

        /* 實時排行榜 (Top 5 Leaderboard) */
        #leaderboard {
            position: absolute; top: 15px; right: 15px; z-index: 5;
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 18px; border-radius: 10px; color: white; min-width: 180px;
            backdrop-filter: blur(4px); pointer-events: none;
        }
        #leaderboard h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #00f2fe; margin-bottom: 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
        #leaderboard ol { list-style: none; padding: 0; margin: 0; }
        #leaderboard li { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 4px; color: #ddd; }
        #leaderboard li.me { color: #ffeb3b; }

        /* 手機控制介面 */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); touch-action: none; z-index: 5; display: none; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- 主大廳 UI -->
    <div id="lobby">
        <div class="panel">
            <h1>FR.io</h1>
            <div class="input-group">
                <label>玩家名稱</label>
                <input type="text" id="nickname" placeholder="請輸入暱稱..." maxlength="10" value="無名玩家">
            </div>
            <div class="input-group">
                <label>選擇伺服器</label>
                <select id="server-select">
                    <option value="frio_srv_asia_1">第一伺服器 (Asia 1)</option>
                    <option value="frio_srv_asia_2">第二伺服器 (Asia 2)</option>
                </select>
            </div>
            <button class="btn-play" onclick="startGame()">進入遊戲</button>
        </div>
    </div>

    <!-- 排行榜面板 -->
    <div id="leaderboard">
        <h3>排行榜</h3>
        <ol id="rank-list"></ol>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

<script>
// --- [1. 程式碼安全保護] ---
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    setInterval(() => {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) window.location.reload();
    }, 2000);
})();

const GAME_SIG = "FR_IO_SECURE_AUTH_2026";
const WORLD_SIZE = 4000;

// --- [2. Canvas 高清適應 & 格子背景紋理繪製] ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let gridPattern = null;

function initGridPattern() {
    // 預先繪製棋盤格紋理以極大化渲染效能
    const pCanvas = document.createElement('canvas');
    const gridSize = 60;
    pCanvas.width = gridSize;
    pCanvas.height = gridSize;
    const pCtx = pCanvas.getContext('2d');

    pCtx.fillStyle = '#0c0f1d';
    pCtx.fillRect(0, 0, gridSize, gridSize);
    pCtx.strokeStyle = '#181d36';
    pCtx.lineWidth = 2;
    pCtx.strokeRect(0, 0, gridSize, gridSize);

    gridPattern = ctx.createPattern(pCanvas, 'repeat');
}

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    initGridPattern();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- [3. 即時 P2P 網路 (低延遲連線)] ---
let peer, conn, isHost = false;
let myName = "無名玩家";
let myId = Math.random().toString(36).substring(7);

let gameState = { players: {}, foods: [] };
let localInput = { angle: 0, speed: 0 };

function startGame() {
    myName = document.getElementById('nickname').value.trim() || "無名玩家";
    const serverId = document.getElementById('server-select').value;
    document.getElementById('lobby').style.display = 'none';

    // 啟動 Peer (採用可靠度調整)
    peer = new Peer(myId + '_' + Math.floor(Math.random()*1000));

    peer.on('open', () => {
        // 設定 P2P DataChannel 連線參數：使用 unreliable 模式降低排隊延遲 (接近 UDP)
        conn = peer.connect(serverId, { 
            metadata: { signature: GAME_SIG },
            reliable: false 
        });

        conn.on('open', () => setupClientConn(conn));
        conn.on('error', () => becomeHost(serverId));

        setTimeout(() => {
            if (!conn || !conn.open) becomeHost(serverId);
        }, 1200);
    });
}

function becomeHost(roomId) {
    isHost = true;
    peer = new Peer(roomId);

    // 初始世界食物
    for (let i = 0; i < 400; i++) gameState.foods.push(createFood());
    gameState.players[myId] = createPlayer(myId, myName);

    peer.on('connection', (c) => {
        if (!c.metadata || c.metadata.signature !== GAME_SIG) { c.close(); return; }

        c.on('data', (data) => {
            if (data.type === 'JOIN') gameState.players[c.peer] = createPlayer(c.peer, data.name);
            if (data.type === 'INPUT' && gameState.players[c.peer]) {
                gameState.players[c.peer].input = data.input;
            }
        });
    });

    // 60 FPS 物理運算，高頻廣播 State 確保順暢
    setInterval(updateHostLogic, 1000 / 40);
}

function setupClientConn(c) {
    c.send({ type: 'JOIN', name: myName });
    c.on('data', (data) => {
        if (data.type === 'STATE') gameState = data.state;
    });
}

function createPlayer(id, name) {
    return {
        id, name,
        x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE,
        mass: 20, color: `hsl(${Math.random() * 360}, 75%, 55%)`,
        input: { angle: 0, speed: 0 }
    };
}

function createFood() {
    return { x: Math.random() * WORLD_SIZE, y: Math.random() * WORLD_SIZE, color: `hsl(${Math.random() * 360}, 85%, 60%)` };
}

function updateHostLogic() {
    Object.keys(gameState.players).forEach(id => {
        let p = gameState.players[id];
        let input = (id === myId) ? localInput : p.input;

        let radius = Math.sqrt(p.mass) * 8;
        let speed = Math.max(2, 7.5 - (radius * 0.04)) * (input.speed || 0);

        p.x += Math.cos(input.angle) * speed;
        p.y += Math.sin(input.angle) * speed;

        p.x = Math.max(radius, Math.min(WORLD_SIZE - radius, p.x));
        p.y = Math.max(radius, Math.min(WORLD_SIZE - radius, p.y));

        for (let i = gameState.foods.length - 1; i >= 0; i--) {
            let f = gameState.foods[i];
            if (Math.hypot(p.x - f.x, p.y - f.y) < radius) {
                p.mass += 1;
                gameState.foods[i] = createFood();
            }
        }
    });

    // 廣播最新全域狀態
    if (peer && peer.connections) {
        Object.keys(peer.connections).forEach(pId => {
            if (peer.connections[pId][0] && peer.connections[pId][0].open) {
                peer.connections[pId][0].send({ type: 'STATE', state: gameState });
            }
        });
    }
}

// --- [4. 即時繪製與 Top 5 排行榜更新] ---
function updateLeaderboard() {
    const listEl = document.getElementById('rank-list');
    
    // 按質量排序玩家
    const sorted = Object.values(gameState.players)
        .sort((a, b) => b.mass - a.mass)
        .slice(0, 5); // 僅選取前 5 名

    listEl.innerHTML = '';
    sorted.forEach((p, index) => {
        const li = document.createElement('li');
        if (p.id === myId) li.className = 'me';
        li.innerHTML = `<span>${index + 1}. ${p.name}</span><span>${Math.floor(p.mass)}</span>`;
        listEl.appendChild(li);
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let me = gameState.players[myId];
    if (me) {
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.translate(window.innerWidth / 2 - me.x, window.innerHeight / 2 - me.y);

        // 1. 繪製棋盤格背景 (無限擴展 Pattern)
        ctx.fillStyle = gridPattern;
        ctx.fillRect(-WORLD_SIZE, -WORLD_SIZE, WORLD_SIZE * 3, WORLD_SIZE * 3);

        // 地圖邊界線
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 8;
        ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        // 2. 食物繪製
        gameState.foods.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // 3. 玩家球體繪製 (正圓 + 名稱)
        Object.values(gameState.players).forEach(p => {
            let r = Math.sqrt(p.mass) * 8;

            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.max(12, r * 0.35)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(p.name, p.x, p.y + (r * 0.1));
        });

        ctx.restore();

        // 刷新排行榜
        updateLeaderboard();
    }

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

// --- [5. 操作控制] ---
window.addEventListener('mousemove', (e) => {
    let centerX = window.innerWidth / 2;
    let centerY = window.innerHeight / 2;
    localInput.angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
    localInput.speed = 1;
    sendInput();
});

function sendInput() {
    if (!isHost && conn && conn.open) conn.send({ type: 'INPUT', input: localInput });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FR.io - Fixed & Optimized Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #080a14; font-family: 'Segoe UI', Arial, sans-serif; position: fixed; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 20, 0.92); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 10; color: white;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel h1 { font-size: 32px; margin-bottom: 15px; color: #00f2fe; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
            background: #161b2e; color: #fff; font-size: 16px; outline: none; -webkit-appearance: none;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 8px;
        }
        .btn-sec { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }

        #hud {
            position: absolute; top: 12px; left: 12px; z-index: 5;
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px; border-radius: 8px; color: white; font-size: 13px; font-weight: bold;
            backdrop-filter: blur(4px); pointer-events: none;
        }

        #leaderboard {
            position: absolute; top: 12px; right: 12px; z-index: 5;
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px; border-radius: 10px; color: white; width: 150px;
            backdrop-filter: blur(4px); pointer-events: none;
        }
        #leaderboard h3 { font-size: 12px; letter-spacing: 1px; color: #00f2fe; margin-bottom: 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
        #leaderboard ol { list-style: none; padding: 0; margin: 0; }
        #leaderboard li { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 3px; color: #ddd; }
        #leaderboard li.me { color: #ffeb3b; }

        #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); touch-action: none; z-index: 5; }
        #joystick-knob { position: absolute; top: 32.5px; left: 32.5px; width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.4); pointer-events: none; }
        #mobile-controls { position: absolute; bottom: 25px; right: 25px; display: flex; gap: 12px; z-index: 5; }
        .act-btn { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); color: white; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .act-btn:active { background: rgba(255,255,255,0.4); }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="lobby" class="overlay-screen">
        <div class="panel">
            <h1>FR.io</h1>
            <div class="input-group">
                <label>玩家名稱</label>
                <input type="text" id="nickname" placeholder="請輸入暱稱..." maxlength="10" value="無名玩家">
            </div>
            <div class="input-group">
                <label>選擇伺服器</label>
                <select id="server-select">
                    <option value="frio_asia_server_1">第一伺服器 (Asia 1)</option>
                    <option value="frio_asia_server_2">第二伺服器 (Asia 2)</option>
                </select>
            </div>
            <button class="btn" onclick="startGame()">進入遊戲</button>
        </div>
    </div>

    <div id="gameover" class="overlay-screen" style="display: none;">
        <div class="panel">
            <h1 style="color: #ff0055;">你被吞噬了！</h1>
            <p style="margin-bottom: 15px; color: #ccc;">最終分數: <span id="final-score" style="color: #ffeb3b; font-weight: bold;">0</span></p>
            <button class="btn" onclick="respawn()">重新遊玩</button>
            <button class="btn btn-sec" onclick="returnToLobby()">返回大廳</button>
        </div>
    </div>

    <div id="hud">總質量: <span id="hud-mass">0</span></div>

    <div id="leaderboard">
        <h3>排行榜</h3>
        <ol id="rank-list"></ol>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="mobile-controls">
        <div class="act-btn" id="btn-w">W</div>
        <div class="act-btn" id="btn-space">分</div>
    </div>

<script>
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

const GAME_SIG = "FR_IO_SECURE_AUTH_2026";
const WORLD_SIZE = 4000;
const PADDING = 60;
const RADIUS_SCALE = 3.8;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let gridPattern = null;

let camera = { x: WORLD_SIZE / 2, y: WORLD_SIZE / 2, scale: 1 };
let particles = [];
let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

function initGridPattern() {
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 60; pCanvas.height = 60;
    const pCtx = pCanvas.getContext('2d');
    pCtx.fillStyle = '#080a14'; pCtx.fillRect(0, 0, 60, 60);
    pCtx.strokeStyle = '#12162a'; pCtx.lineWidth = 2; pCtx.strokeRect(0, 0, 60, 60);
    gridPattern = ctx.createPattern(pCanvas, 'repeat');
}

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    initGridPattern();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let peer, conn, isHost = false;
let myName = "無名玩家";
let myId = 'peer_' + Math.random().toString(36).substring(2, 9);

let gameState = { players: {}, foods: [], viruses: [], ejected: [] };
let localInput = { angle: 0, speed: 0, split: false, eject: false };
let lastSendTime = 0;

function startGame() {
    myName = document.getElementById('nickname').value.trim() || "無名玩家";
    const serverId = document.getElementById('server-select').value;
    document.getElementById('lobby').style.display = 'none';

    peer = new Peer(myId);
    peer.on('open', () => {
        conn = peer.connect(serverId, { metadata: { signature: GAME_SIG }, reliable: false });
        conn.on('open', () => setupClientConn(conn));
        conn.on('error', () => becomeHost(serverId));

        setTimeout(() => {
            if (!conn || !conn.open) becomeHost(serverId);
        }, 1200);
    });
}

function respawn() {
    document.getElementById('gameover').style.display = 'none';
    if (isHost) {
        gameState.players[myId] = createPlayer(myId, myName);
    } else if (conn && conn.open) {
        conn.send({ type: 'RESPAWN', name: myName });
    }
}

function returnToLobby() {
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('lobby').style.display = 'flex';
    if (peer) peer.destroy();
}

function becomeHost(roomId) {
    isHost = true;
    peer = new Peer(roomId);

    for (let i = 0; i < 400; i++) gameState.foods.push(createFood());
    for (let i = 0; i < 16; i++) gameState.viruses.push(createVirus());
    gameState.players[myId] = createPlayer(myId, myName);

    peer.on('connection', (c) => {
        if (!c.metadata || c.metadata.signature !== GAME_SIG) { c.close(); return; }

        c.on('data', (data) => {
            if (gameState.players[c.peer]) gameState.players[c.peer].lastSeen = Date.now();
            if (data.type === 'JOIN' || data.type === 'RESPAWN') {
                gameState.players[c.peer] = createPlayer(c.peer, data.name);
            }
            if (data.type === 'INPUT' && gameState.players[c.peer]) {
                gameState.players[c.peer].input = data.input;
            }
        });
        c.on('close', () => { delete gameState.players[c.peer]; });
    });

    setInterval(updateHostLogic, 1000 / 30);
}

function setupClientConn(c) {
    c.send({ type: 'JOIN', name: myName });
    c.on('data', (data) => {
        if (data.type === 'STATE') {
            Object.keys(data.state.players).forEach(pId => {
                let pNew = data.state.players[pId];
                let pOld = gameState.players[pId];
                if (pOld) {
                    pNew.cells.forEach((cNew, idx) => {
                        if (pOld.cells[idx]) {
                            cNew.renderX = pOld.cells[idx].renderX + (cNew.x - pOld.cells[idx].renderX) * 0.4;
                            cNew.renderY = pOld.cells[idx].renderY + (cNew.y - pOld.cells[idx].renderY) * 0.4;
                        } else {
                            cNew.renderX = cNew.x; cNew.renderY = cNew.y;
                        }
                    });
                } else {
                    pNew.cells.forEach(cNew => { cNew.renderX = cNew.x; cNew.renderY = cNew.y; });
                }
            });
            gameState = data.state;
        }
    });
}

function createPlayer(id, name) {
    return {
        id, name,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`,
        cells: [{
            x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
            renderX: 0, renderY: 0,
            mass: 20, vx: 0, vy: 0, splitTime: 0
        }],
        input: { angle: 0, speed: 0, split: false, eject: false },
        lastSeen: Date.now()
    };
}

function createFood() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        y: Math.random() * (WORLD_SIZE - PADDING * 2) + PADDING,
        color: `hsl(${Math.random() * 360}, 85%, 60%)`
    };
}

function createVirus() {
    return {
        x: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        y: Math.random() * (WORLD_SIZE - PADDING * 4) + PADDING * 2,
        radius: 46, mass: 100
    };
}

function addParticles(x, y, color, count = 6) {
    for (let i = 0; i < count; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = Math.random() * 4 + 2;
        particles.push({
            x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
            life: 1.0, color
        });
    }
}

function updateHostLogic() {
    const now = Date.now();

    Object.keys(gameState.players).forEach(pId => {
        if (pId !== myId && now - gameState.players[pId].lastSeen > 3000) delete gameState.players[pId];
    });

    Object.values(gameState.players).forEach(p => {
        let input = (p.id === myId) ? localInput : p.input;

        if (input.eject && now - (p.lastEject || 0) > 80) {
            p.cells.forEach(cell => {
                if (cell.mass >= 35) {
                    cell.mass -= 13;
                    let r = Math.sqrt(cell.mass) * RADIUS_SCALE;
                    gameState.ejected.push({
                        x: cell.x + Math.cos(input.angle) * (r + 12),
                        y: cell.y + Math.sin(input.angle) * (r + 12),
                        angle: input.angle, speed: 15, mass: 10, color: p.color
                    });
                }
            });
            p.lastEject = now;
            input.eject = false;
        }

        if (input.split) {
            let availableSplits = 16 - p.cells.length;
            if (availableSplits > 0) {
                let newCells = [];
                for (let cell of p.cells) {
                    if (cell.mass >= 36 && newCells.length < availableSplits) {
                        cell.mass /= 2;
                        newCells.push({
                            x: cell.x, y: cell.y, renderX: cell.x, renderY: cell.y,
                            mass: cell.mass,
                            vx: Math.cos(input.angle) * 22, vy: Math.sin(input.angle) * 22,
                            splitTime: now
                        });
                        cell.splitTime = now;
                    }
                }
                p.cells.push(...newCells);
            }
            input.split = false;
        }

        p.cells.forEach((cell) => {
            let radius = Math.sqrt(cell.mass) * RADIUS_SCALE;
            let speed = Math.max(1.8, 8.5 - (radius * 0.035)) * (input.speed || 0);

            cell.x += Math.cos(input.angle) * speed + (cell.vx || 0);
            cell.y += Math.sin(input.angle) * speed + (cell.vy || 0);

            if (cell.vx) cell.vx *= 0.88;
            if (cell.vy) cell.vy *= 0.88;

            cell.x = Math.max(radius + 10, Math.min(WORLD_SIZE - radius - 10, cell.x));
            cell.y = Math.max(radius + 10, Math.min(WORLD_SIZE - radius - 10, cell.y));

            cell.renderX = cell.renderX ? cell.renderX + (cell.x - cell.renderX) * 0.5 : cell.x;
            cell.renderY = cell.renderY ? cell.renderY + (cell.y - cell.renderY) * 0.5 : cell.y;

            for (let i = gameState.foods.length - 1; i >= 0; i--) {
                let f = gameState.foods[i];
                if (Math.hypot(cell.x - f.x, cell.y - f.y) < radius) {
                    cell.mass += 1;
                    gameState.foods[i] = createFood();
                }
            }
            for (let i = gameState.ejected.length - 1; i >= 0; i--) {
                let e = gameState.ejected[i];
                if (Math.hypot(cell.x - e.x, cell.y - e.y) < radius) {
                    cell.mass += e.mass;
                    gameState.ejected.splice(i, 1);
                }
            }

            // 修正：病毒拆分質量計算修正
            for (let i = 0; i < gameState.viruses.length; i++) {
                let v = gameState.viruses[i];
                if (cell.mass > v.radius && Math.hypot(cell.x - v.x, cell.y - v.y) < radius) {
                    let maxAllowed = 16 - p.cells.length;
                    if (maxAllowed > 0) {
                        let targetPieces = Math.min(maxAllowed + 1, Math.floor(cell.mass / 20));
                        if (targetPieces > 1) {
                            let splitMass = cell.mass / targetPieces;
                            cell.mass = splitMass;
                            for (let k = 1; k < targetPieces; k++) {
                                let a = (Math.PI * 2 / targetPieces) * k;
                                p.cells.push({
                                    x: cell.x, y: cell.y, renderX: cell.x, renderY: cell.y,
                                    mass: splitMass, vx: Math.cos(a) * 18, vy: Math.sin(a) * 18,
                                    splitTime: now
                                });
                            }
                        }
                    }
                    gameState.viruses[i] = createVirus();
                    break;
                }
            }
        });

        for (let i = 0; i < p.cells.length; i++) {
            for (let j = i + 1; j < p.cells.length; j++) {
                let c1 = p.cells[i], c2 = p.cells[j];
                let dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                let r1 = Math.sqrt(c1.mass) * RADIUS_SCALE, r2 = Math.sqrt(c2.mass) * RADIUS_SCALE;
                let minDist = r1 + r2;

                if (now - c1.splitTime > 30000 && now - c2.splitTime > 30000) {
                    if (dist < r1) {
                        c1.mass += c2.mass;
                        p.cells.splice(j, 1);
                        j--;
                    }
                } else if (dist < minDist && dist > 0) {
                    let overlap = minDist - dist;
                    let nx = (c1.x - c2.x) / dist;
                    let ny = (c1.y - c2.y) / dist;
                    c1.x += nx * overlap * 0.15; c1.y += ny * overlap * 0.15;
                    c2.x -= nx * overlap * 0.15; c2.y -= ny * overlap * 0.15;
                }
            }
        }
    });

    gameState.ejected.forEach(e => {
        if (e.speed > 0.1) {
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;
            e.speed *= 0.88;
        } else {
            e.speed = 0;
        }
    });

    let allPlayers = Object.values(gameState.players);
    for (let i = 0; i < allPlayers.length; i++) {
        for (let j = 0; j < allPlayers.length; j++) {
            if (i === j) continue;
            let p1 = allPlayers[i], p2 = allPlayers[j];

            p1.cells.forEach(c1 => {
                for (let k = p2.cells.length - 1; k >= 0; k--) {
                    let c2 = p2.cells[k];
                    if (c1.mass >= c2.mass * 1.15) {
                        let r1 = Math.sqrt(c1.mass) * RADIUS_SCALE;
                        if (Math.hypot(c1.x - c2.x, c1.y - c2.y) < r1 - 5) {
                            c1.mass += c2.mass;
                            addParticles(c2.x, c2.y, p2.color, 12);
                            p2.cells.splice(k, 1);
                        }
                    }
                }
            });

            if (p2.cells.length === 0) {
                if (p2.id === myId && document.getElementById('gameover').style.display !== 'flex') {
                    triggerGameOver(p2.lastScore || 0);
                }
                delete gameState.players[p2.id];
            } else {
                p2.lastScore = p2.cells.reduce((sum, c) => sum + c.mass, 0);
            }
        }
    }

    if (peer && peer.connections) {
        Object.keys(peer.connections).forEach(pId => {
            peer.connections[pId].forEach(c => {
                if (c && c.open) c.send({ type: 'STATE', state: gameState });
            });
        });
    }
}

function triggerGameOver(score) {
    document.getElementById('final-score').innerText = Math.floor(score);
    document.getElementById('gameover').style.display = 'flex';
}

function drawSpikedVirus(x, y, radius) {
    ctx.save();
    ctx.fillStyle = '#33ff33';
    ctx.strokeStyle = '#1fb81f';
    ctx.lineWidth = 4;
    ctx.beginPath();
    let spikes = 16;
    for (let i = 0; i < spikes; i++) {
        let angle = (i / spikes) * Math.PI * 2;
        let r = (i % 2 === 0) ? radius : radius - 6;
        let vx = x + Math.cos(angle) * r;
        let vy = y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function updateHUD(totalMass) {
    document.getElementById('hud-mass').innerText = Math.floor(totalMass);
}

function updateLeaderboard() {
    const listEl = document.getElementById('rank-list');
    const sorted = Object.values(gameState.players).map(p => ({
        id: p.id, name: p.name,
        totalMass: p.cells.reduce((sum, c) => sum + c.mass, 0)
    })).sort((a, b) => b.totalMass - a.totalMass).slice(0, 5);

    let html = '';
    sorted.forEach((p, i) => {
        html += `<li class="${p.id === myId ? 'me' : ''}"><span>${i + 1}. ${p.name}</span><span>${Math.floor(p.totalMass)}</span></li>`;
    });
    listEl.innerHTML = html;
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let me = gameState.players[myId];
    if (me && me.cells.length > 0) {
        let avgX = me.cells.reduce((sum, c) => sum + (c.renderX || c.x), 0) / me.cells.length;
        let avgY = me.cells.reduce((sum, c) => sum + (c.renderY || c.y), 0) / me.cells.length;
        let totalMass = me.cells.reduce((sum, c) => sum + c.mass, 0);

        updateHUD(totalMass);

        let targetScale = Math.max(0.4, 1 - (Math.sqrt(totalMass) * 0.004));
        camera.scale += (targetScale - camera.scale) * 0.05;
        camera.x += (avgX - camera.x) * 0.1;
        camera.y += (avgY - camera.y) * 0.1;
    }

    ctx.save();
    ctx.scale(dpr, dpr);

    ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
    ctx.scale(camera.scale, camera.scale);
    ctx.translate(-camera.x, -camera.y);

    ctx.fillStyle = gridPattern;
    ctx.fillRect(-WORLD_SIZE, -WORLD_SIZE, WORLD_SIZE * 3, WORLD_SIZE * 3);

    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 12;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    gameState.foods.forEach(f => {
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI * 2); ctx.fill();
    });
    gameState.ejected.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath(); ctx.arc(e.x, e.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    });

    gameState.viruses.forEach(v => drawSpikedVirus(v.x, v.y, v.radius));

    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i];
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = pt.life;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2); ctx.fill();
        pt.x += pt.vx; pt.y += pt.vy;
        pt.life -= 0.03;
        if (pt.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1.0;

    let renderCells = [];
    Object.values(gameState.players).forEach(p => {
        p.cells.forEach(c => renderCells.push({ ...c, color: p.color, name: p.name }));
    });
    renderCells.sort((a, b) => a.mass - b.mass);

    renderCells.forEach(c => {
        let rx = c.renderX || c.x;
        let ry = c.renderY || c.y;
        let r = Math.sqrt(c.mass) * RADIUS_SCALE;

        ctx.fillStyle = c.color;
        ctx.beginPath(); ctx.arc(rx, ry, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, r * 0.05); ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.max(12, r * 0.32)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(c.name, rx, ry - (r * 0.08));
        ctx.font = `${Math.max(10, r * 0.25)}px sans-serif`;
        ctx.fillText(Math.floor(c.mass), rx, ry + (r * 0.28));
    });

    ctx.restore();
    updateLeaderboard();

    requestAnimationFrame(render);
}
requestAnimationFrame(render);

window.addEventListener('mousemove', (e) => {
    mousePos.x = e.clientX;
    mousePos.y = e.clientY;

    let worldMouseX = (e.clientX - window.innerWidth / 2) / camera.scale + camera.x;
    let worldMouseY = (e.clientY - window.innerHeight / 2) / camera.scale + camera.y;

    let me = gameState.players[myId];
    if (me && me.cells.length > 0) {
        let avgX = me.cells.reduce((sum, c) => sum + c.x, 0) / me.cells.length;
        let avgY = me.cells.reduce((sum, c) => sum + c.y, 0) / me.cells.length;
        localInput.angle = Math.atan2(worldMouseY - avgY, worldMouseX - avgX);
        localInput.speed = 1;
        sendInput();
    }
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyW') { localInput.eject = true; sendInput(true); }
    if (e.code === 'Space') { localInput.split = true; sendInput(true); }
});

const joyZone = document.getElementById('joystick-zone');
const joyKnob = document.getElementById('joystick-knob');
let joyTouchId = null;

joyZone.addEventListener('touchstart', (e) => {
    if (joyTouchId === null) {
        let touch = e.changedTouches[0];
        joyTouchId = touch.identifier;
    }
});

joyZone.addEventListener('touchmove', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
            let rect = joyZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy);
            let maxDist = rect.width / 2;
            let angle = Math.atan2(dy, dx);
            let limitDist = Math.min(dist, maxDist);

            joyKnob.style.transform = `translate(${Math.cos(angle)*limitDist}px, ${Math.sin(angle)*limitDist}px)`;
            localInput.angle = angle;
            localInput.speed = limitDist / maxDist;
            sendInput();
            break;
        }
    }
});

function resetJoystick(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
            joyTouchId = null;
            joyKnob.style.transform = `translate(0px, 0px)`;
            localInput.speed = 0;
            sendInput(true);
            break;
        }
    }
}
joyZone.addEventListener('touchend', resetJoystick);
joyZone.addEventListener('touchcancel', resetJoystick);

document.getElementById('btn-w').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.eject = true; sendInput(true); });
document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); localInput.split = true; sendInput(true); });

// 修正：發送頻率限制 (Throttle)，避免過度傳輸塞爆 WebRTC 緩衝區
function sendInput(force = false) {
    const now = Date.now();
    if (force || now - lastSendTime > 33) { // 限制最快每秒約 30 次發送
        if (!isHost && conn && conn.open) {
            conn.send({ type: 'INPUT', input: localInput });
            lastSendTime = now;
        }
    }
}
</script>
